name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Version and changelog come from conventional commits via the manifest.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      # Tool versions from mise.toml. Node 24 ships npm 11, which publishes through npm
      # trusted publishing (OIDC).
      - uses: jdx/mise-action@v2
      - run: mise run build
      - run: mise run test
      - name: Pack
        id: pack
        run: |
          file=$(npm pack --silent)
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "${{ steps.pack.outputs.file }}" "${{ steps.pack.outputs.file }}.sha256" --clobber
      # NPM_TOKEN is only needed until trusted publishing is configured on npmjs.com.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish "${{ steps.pack.outputs.file }}" --provenance --access public
